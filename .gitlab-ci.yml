stages: [validate, publish]

validate:
  stage: validate
  image: python:3.12-slim
  script:
    - python3 scripts/validate.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Variante "remote URL": pubblica skills + index.json e rules su GitLab Pages.
# Poi nel config: "skills": { "urls": ["https://<pages>/skills/"] }
# e in "instructions" gli URL di https://<pages>/rules/*.md
pages:
  stage: publish
  image: python:3.12-slim
  script:
    - python3 scripts/build_skills_index.py
    - mv dist public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
